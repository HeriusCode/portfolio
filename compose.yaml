services:
  portfolio:
    container_name: developer-portfolio
    build:
      context: .
      dockerfile: Dockerfile
    image: herius/portfolio:1.0
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin@2026}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_developer_portfolio_2026}
      - PUSHBULLET_ACCESS_TOKEN=${PUSHBULLET_ACCESS_TOKEN:-}
      - PUSHBULLET_ADMIN_IDEN=${PUSHBULLET_ADMIN_IDEN:-}
      - PUSHBULLET_ADMIN_DEVICE_IDEN=${PUSHBULLET_ADMIN_DEVICE_IDEN:-}
      - PUSHBULLET_BANNER_TITLE=${PUSHBULLET_BANNER_TITLE:-PORTFOLIO_BANNER}
      - PUSHBULLET_POLL_INTERVAL=${PUSHBULLET_POLL_INTERVAL:-10000}
      - BARK_DEVICE_KEY=${BARK_DEVICE_KEY:-}
      - BARK_SERVER_URL=${BARK_SERVER_URL:-https://api.day.app}
      - DB_PATH=/app/backend/data/portfolio.db
    volumes:
      - portfolio_data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portfolio_data:
    name: portfolio_sqlite_data

